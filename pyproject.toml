[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "unicorn.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"apps/rules/hard_frame.py" = ["E501"]  # long rule texts, copied from docs/01

[project]
name = "unicorn"
version = "0.0.0"
description = "A planned, horizontal economy inside capitalism, for its members."
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "unicorn.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
"apps/rules/hard_frame.py" = ["E501"]  # long rule texts, copied from docs/01

{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Ask the fund to buy something" %} · Unicorn{% endblock %}
{% block content %}
<h1>{% translate "Ask the fund to buy something" %}</h1>
<form method="post" class="mb-4">{% csrf_token %}
  <div class="mb-3"><label class="form-label" for="d">{% translate "What should be bought?" %}</label><input class="form-control" id="d" name="description" maxlength="200" required></div>
  <div class="row"><div class="col-8 mb-3"><label class="form-label" for="p">{% translate "Estimated price" %}</label><input class="form-control" id="p" name="est_price" inputmode="decimal" required></div>
  <div class="col-4 mb-3"><label class="form-label" for="c">{% translate "Currency" %}</label><input class="form-control" id="c" name="currency" value="EUR" maxlength="3"></div></div>
  <div class="mb-3"><label class="form-label" for="s">{% translate "Seller (a name or a link)" %}</label><input class="form-control" id="s" name="seller"></div>
  <div class="mb-3"><label class="form-label" for="i">{% translate "Seller's account number (IBAN), if they take bank transfers" %}</label><input class="form-control" id="i" name="seller_iban" autocomplete="off"></div>
  <div class="mb-3"><label class="form-label" for="w">{% translate "Why is it needed?" %}</label><input class="form-control" id="w" name="why" maxlength="300"></div>
  <button class="btn btn-primary" type="submit">{% translate "Send the request" %}</button>
</form>
{% endblock %}

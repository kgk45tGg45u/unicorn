{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Not possible for someone else" %} · Unicorn{% endblock %}
{% block content %}
<h1>{% translate "Not possible for someone else" %}</h1>
<p>{{ message }}</p>
<form method="post" action="{% url 'members:assist_stop' %}">{% csrf_token %}

</form>
{% endblock %}

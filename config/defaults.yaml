    dormant_after_months: {value: 6, type: int, min: 1, max: 36, tier: confirm, source: "proposal", help: "A unit without activity this long becomes dormant."}
    join_forces_value_gap: {value: 0.30, type: decimal, min: 0.05, max: 5.0, tier: confirm, source: "owner 2026-11-21 (join forces); proposal", help: "Two units making the same item get a 'join forces' suggestion when one needs this much more time."}

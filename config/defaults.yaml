  min_age: {value: 18, type: int, min: 18, max: 18, tier: hard, source: "legal (contracts)", help: "Minimum age of members."}
  vouches_needed: {value: 2, type: int, min: 1, max: 5, tier: referendum, source: "proposal (real-world file 3)", help: "Verified members who must vouch for a new member."}

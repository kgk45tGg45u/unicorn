# Unicorn: the democratic defaults (docs/01_hard_frame_and_defaults.md)
#
# Every leaf is a mapping with:
#   value    the default
#   type     decimal | int | bool | choice | text | list
#   min/max  hard bounds (decimal, int). Crossing them is a hard-frame change.
#   choices  allowed values (choice). Adding a choice is a hard-frame change.
#   tier     who may change it: unit | confirm | plan | referendum | hard   (docs/01, section 3)
#   source   sim = the simulation's most successful world (docs/02, section 3) | book p.N | owner YYYY-MM-DD | legal | proposal
#   help     one plain sentence shown to members
#
# Dotted keys come from the nesting: economy.flat_tax.method.
# `python manage.py load_defaults` copies this file into rules.Parameter (it never overwrites values members have changed).
# The coding agent must not change values here (CLAUDE.md, section 2).

economy:
  uniq_per_hour: {value: 1, type: decimal, min: 1, max: 1, tier: hard, source: "book p.39; HF-2", help: "One approved hour of work pays this many UNIQ before tax, for everyone."}
  flat_tax:
    method: {value: balance_monthly, type: choice, choices: [balance_monthly, balance_yearly, fixed], tier: plan, source: "sim (plan.tax_balance); book p.88", help: "How the flat tax is set: balanced every month, balanced once a year, or fixed by the members."}
    min: {value: 0.0, type: decimal, min: 0.0, max: 0.0, tier: hard, source: "HF-9", help: "The lowest possible flat tax."}
    max: {value: 0.68, type: decimal, min: 0.68, max: 0.68, tier: hard, source: "owner 2026-10-14 (band 30-68%); HF-9", help: "The highest possible flat tax."}
    fixed_rate: {value: 0.35, type: decimal, min: 0.30, max: 0.68, tier: plan, source: "owner 2026-10-14; docs/02 finding 6", help: "The rate used when the members fix the flat tax."}
    start_rate: {value: 0.20, type: decimal, min: 0.0, max: 0.68, tier: plan, source: "sim (about 16-20% in the first years)", help: "The flat tax of the first month, before there is data to balance it."}
  social_share_start: {value: 0.03, type: decimal, min: 0.0, max: 0.5, tier: plan, source: "sim (tools_first_early_benefits)", help: "Share of all hours for free social services and coordination at the start."}
  social_share_end: {value: 0.17, type: decimal, min: 0.0, max: 0.5, tier: plan, source: "sim", help: "Share reached when every member can live without a capitalist job."}
  accumulation_share: {value: 0.02, type: decimal, min: 0.0, max: 0.5, tier: plan, source: "sim", help: "Share of all hours, paid by the flat tax, that builds Unicorn's own tools and workplaces."}
  outside_sales_cap_share: {value: 0.53, type: decimal, min: 0.0, max: 0.9, tier: plan, source: "sim (export_cap)", help: "Largest share of all hours that may go to selling to outside customers."}
  tools_from_outside_sales_share: {value: 0.5, type: decimal, min: 0.0, max: 1.0, tier: plan, source: "sim (export_for_tools)", help: "Share of the planned tool purchases that extra outside sales should earn."}
  activation_share: {value: 0.57, type: decimal, min: 0.0, max: 1.0, tier: plan, source: "sim", help: "Share of new tools and workplaces that goes to opening new trades."}
  euro_priority: {value: tools, type: choice, choices: [tools, goods], tier: plan, source: "sim; book p.84 (accumulation decided first)", help: "When euros are short, who keeps them first: Unicorn's planned tools, or the materials of members' goods."}
  min_offer_share_when_euros_short: {value: 0.44, type: decimal, min: 0.0, max: 1.0, tier: plan, source: "sim (min_offer)", help: "When euros are short, at least this share of members' usual purchases stays on offer (those needing the fewest euros)."}
  tax_on_outside_sales_estimate: {value: 0.15, type: decimal, min: 0.0, max: 0.6, tier: confirm, source: "sim (world that passed all tests)", help: "Default share of an outside sale a seller keeps back for their own taxes; sellers may change theirs with a reason."}
  issue_tolerance_share: {value: 0.2, type: decimal, min: 0.0, max: 1.0, tier: confirm, source: "proposal (book p.58 credit line)", help: "Paying more hours than the plan expected, by more than this share, opens a warning ticket."}
  fund1_deficit_years: {value: 20, type: int, min: 0, max: 50, tier: referendum, source: "owner 2026-10-09", help: "Years during which unspent UNIQ may grow; afterwards the plan must shrink them or keep them within members' savings target."}
  savings_target_months: {value: 6, type: decimal, min: 1, max: 24, tier: plan, source: "sim (members.savings.target_months)", help: "Months of their own spending that members usually want to keep as savings."}
  products:
    advance_share: {value: 0.10, type: decimal, min: 0.0, max: 1.0, tier: plan, source: "sim (members_advance_share); owner 2026-11-21", help: "Share of expected orders a unit may make before the orders arrive."}
    outside_advance_share: {value: 0.10, type: decimal, min: 0.0, max: 1.0, tier: plan, source: "sim (outside_advance_share); owner 2026-11-21", help: "The same for products sold to outside customers."}
    own_initiative_pay: {value: when_sold, type: choice, choices: [when_sold, when_approved], tier: referendum, source: "owner 2026-11-21 (mixed rule)", help: "Hours on products made beyond orders and the advance share are paid when the products sell. Paying them earlier risks hidden inflation."}
    unsold_after_days: {value: 90, type: int, min: 7, max: 365, tier: confirm, source: "proposal", help: "Products made ahead that stay unsold this long are written off."}
    cancel_rule: {value: free_until_batch_start, type: choice, choices: [free_until_batch_start, free_until_delivery], tier: confirm, source: "proposal", help: "Until when a member may cancel an order without paying."}
  services:
    pay_rule: {value: when_performed, type: choice, choices: [when_performed, planned_shifts, by_type], tier: plan, source: "owner 2026-11-21", help: "Service hours are paid only when performed; planned shifts or a rule by type of service can be chosen later."}
    customer_confirm_hours: {value: 48, type: int, min: 12, max: 168, tier: confirm, source: "proposal", help: "Hours a customer has to confirm or dispute a performed service; silence counts as confirmed."}
    no_show_paid: {value: false, type: bool, tier: plan, source: "proposal", help: "Whether a provider is paid when a customer does not come."}
  retirement:
    suggest_on_alarm: {value: true, type: bool, tier: plan, source: "proposal (sim moved savings automatically)", help: "While unspent UNIQ are too many, the app suggests moving savings above the target into the retirement account."}
    suggest_share: {value: 0.5, type: decimal, min: 0.0, max: 1.0, tier: plan, source: "sim (deposit_share)", help: "Share of savings above the target the app suggests moving."}
    payout_months: {value: 240, type: int, min: 12, max: 480, tier: referendum, source: "sim", help: "Months over which a retirement account is paid back in equal parts."}
    early_withdrawal_max_share_per_month: {value: 0.0833, type: decimal, min: 0.0, max: 1.0, tier: referendum, source: "proposal; book p.93", help: "Before pension age, at most this share of the retirement account can be taken out each month."}
  pension:
    enabled: {value: true, type: bool, tier: referendum, source: "owner 2026-11-21", help: "Members past pension age or unable to work get an equal pension in UNIQ, paid from the flat tax."}
    qualifying_active_months: {value: 36, type: int, min: 0, max: 120, tier: referendum, source: "owner 2026-11-21 ('2 or 3 years')", help: "Active months in Unicorn needed before the pension is paid."}
    active_month_min_hours: {value: 10, type: decimal, min: 0, max: 160, tier: referendum, source: "proposal", help: "Approved hours that make a month count as active (care and illness months also count)."}
    share_of_median_net: {value: 0.6, type: decimal, min: 0.0, max: 1.0, tier: plan, source: "proposal (not simulated)", help: "The pension as a share of the median monthly net UNIQ income of active members."}
    age: {value: 67, type: int, min: 55, max: 75, tier: referendum, source: "legal (German statutory age); proposal", help: "Pension age for members in Germany."}
  benefits:
    distribution: {value: by_need, type: choice, choices: [by_need, equal], tier: plan, source: "sim", help: "How the fund pays members' basic euro bills: heaviest burden first, or the same for everyone."}
    may_start: {value: anytime, type: choice, choices: [anytime, after_tools], tier: plan, source: "sim (benefit_start anytime)", help: "Whether bills may be paid before the planned tools are bought."}
    min_attractiveness: {value: 1.15, type: decimal, min: 1.0, max: 3.0, tier: plan, source: "sim (benefit_min_attr)", help: "The benefit budget grows only while an hour in Unicorn buys at least this many hours of a typical capitalist job."}
    adjust_months: {value: 6, type: int, min: 1, max: 24, tier: plan, source: "sim", help: "Months over which the benefit budget moves toward what the fund can sustain."}
    cut_per_month_below_min_reserve: {value: 0.05, type: decimal, min: 0.0, max: 0.5, tier: plan, source: "sim", help: "Monthly cut of the benefit budget while the euro reserve is below its minimum."}
    guarantee: {value: true, type: bool, tier: referendum, source: "sim (basic_guarantee); constitution draft rule 8", help: "Nobody is worse off on basic needs than without Unicorn: the fund tops them up."}
    independent_costs_eur: {value: 250, type: decimal, min: 0, max: 2000, tier: confirm, source: "sim", help: "Typical monthly euro costs (health and care insurance) of a member without a capitalist job."}
  shortage_bonus:
    enabled: {value: false, type: bool, tier: referendum, source: "book p.76; HF-2", help: "A temporary extra per hour in one trade with a red shortage. Off unless a referendum switches it on."}
    max_share: {value: 0.25, type: decimal, min: 0.0, max: 0.25, tier: hard, source: "HF-2", help: "The largest possible bonus per hour."}
    max_months: {value: 3, type: int, min: 1, max: 3, tier: hard, source: "HF-2", help: "The longest a bonus can last per decision."}
  planning_rate:
    method: {value: measured_outside_sales, type: choice, choices: [measured_outside_sales, fixed], tier: plan, source: "book p.154; proposal", help: "How the planning rate is found: euros earned per hour of outside sales, or a fixed number. Only for comparing, never an exchange."}
    fallback_eur_per_hour: {value: 17.35, type: decimal, min: 1, max: 200, tier: plan, source: "sim (average German net wage)", help: "Euros per hour used until outside sales have been measured."}
    measure_months: {value: 12, type: int, min: 1, max: 36, tier: confirm, source: "proposal", help: "Months of outside sales used to measure the planning rate."}

alarms:
  unspent_uniq_amber_months: {value: 6, type: decimal, min: 1, max: 24, tier: plan, source: "sim (savings target)", help: "Unspent UNIQ above this many months of spending turn the light amber."}
  unspent_uniq_red_multiple: {value: 2.0, type: decimal, min: 1.0, max: 10.0, tier: plan, source: "sim (alarms.uniq_red)", help: "Red at this multiple of the amber level."}
  shelves_amber: {value: 0.95, type: decimal, min: 0.5, max: 1.0, tier: plan, source: "sim", help: "Amber when members get less than this share of what they order in time."}
  shelves_red: {value: 0.80, type: decimal, min: 0.3, max: 1.0, tier: plan, source: "sim", help: "Red below this share."}
  unsold_amber: {value: 0.10, type: decimal, min: 0.0, max: 1.0, tier: plan, source: "sim results (10% costs little)", help: "Amber when more than this share of products made ahead is written off."}
  unsold_red: {value: 0.30, type: decimal, min: 0.0, max: 1.0, tier: plan, source: "sim results (30% delays independence a decade)", help: "Red above this share."}

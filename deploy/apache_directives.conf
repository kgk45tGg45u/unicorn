# FALLBACK ONLY (P15.T05). Normally the file deploy/htaccess_template does this job without touching any setting.
# Use this only if the .htaccess file turns out not to be honoured on the box. Virtualmin: "Services" >
# "Configure Website" > "Edit Directives" of the SSL website of THIS virtual server. Replace <PORT> with the site's
# GUNICORN_PORT. Then reload Apache from Virtualmin (or: apachectl configtest && systemctl reload httpd, as root).
ProxyPreserveHost On
ProxyPass /.well-known/acme-challenge/ !
ProxyPass /static/ !
ProxyPass / http://127.0.0.1:<PORT>/ timeout=60
ProxyPassReverse / http://127.0.0.1:<PORT>/
RequestHeader set X-Forwarded-Proto "https"
# 12 MB: a little more than the largest file the app takes (10 MB, with the form around it).
LimitRequestBody 12582912

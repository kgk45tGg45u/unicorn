# Apache directives for the SSL site of a virtual server (P15.T05).
# Virtualmin: "Web Configuration" > "Edit Directives" of the SSL website. Paste these lines.
# For staging, use port 8002 instead of 8001 (the same port as in unicorn-staging.service).
# Then:  apachectl configtest && systemctl reload httpd
ProxyPreserveHost On
# Let's Encrypt renewals are answered by Apache, not by the app.
ProxyPass /.well-known/acme-challenge/ !
# Static files come from public_html/static (collectstatic puts them there).
ProxyPass /static/ !
ProxyPass / http://127.0.0.1:8001/ timeout=60
ProxyPassReverse / http://127.0.0.1:8001/
# The app trusts this header to know the request came over HTTPS (SECURE_PROXY_SSL_HEADER).
RequestHeader set X-Forwarded-Proto "https"
# 12 MB: a little more than the largest file the app takes (10 MB, with the form around it).
LimitRequestBody 12582912
